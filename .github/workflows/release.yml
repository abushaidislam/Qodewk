name: "Release & Publish Package"

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release version tag (e.g. v0.1.7)'
        required: false
        default: ''

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Upgrade npm to latest (Required for Trusted Publishing)
        run: npm install -g npm@latest

      - name: Install Monorepo Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build CLI & Dependencies
        run: pnpm --filter qodewk... build

      - name: Check Package Version & Determine Release Need
        id: check_release
        run: |
          CLI_VERSION=$(node -p "require('./packages/cli/package.json').version")
          echo "CLI_VERSION=$CLI_VERSION" >> $GITHUB_ENV
          echo "CLI Version from package.json: $CLI_VERSION"

          # Check if pushed as explicit tag
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "Explicit tag push detected. Will publish and release."
            echo "SHOULD_RELEASE=true" >> $GITHUB_ENV
            exit 0
          fi

          # Check if manual dispatch with tag specified
          if [ -n "${{ inputs.tag_name }}" ]; then
            echo "Manual dispatch triggered with tag: ${{ inputs.tag_name }}."
            echo "SHOULD_RELEASE=true" >> $GITHUB_ENV
            exit 0
          fi

          # Check against published npm version
          PUBLISHED_VERSION=$(npm view qodewk version 2>/dev/null || echo "")
          echo "Currently published version on NPM: $PUBLISHED_VERSION"

          if [ "$PUBLISHED_VERSION" != "$CLI_VERSION" ]; then
            echo "New version detected ($CLI_VERSION vs published $PUBLISHED_VERSION)! Preparing to release."
            echo "SHOULD_RELEASE=true" >> $GITHUB_ENV
          else
            echo "Version $CLI_VERSION is already published on npm. Skipping publish and release."
            echo "SHOULD_RELEASE=false" >> $GITHUB_ENV
          fi

      - name: Publish to NPM Registry (Trusted Publisher / OIDC)
        if: env.SHOULD_RELEASE == 'true'
        run: |
          echo "Publishing qodewk v${{ env.CLI_VERSION }} to Public NPM via Trusted Publisher (OIDC)..."
          [ ! -f packages/cli/README.md ] && cp README.md packages/cli/README.md 2>/dev/null || true
          [ ! -f packages/cli/LICENSE ] && cp LICENSE packages/cli/LICENSE 2>/dev/null || true
          cd packages/cli
          npm publish --provenance --access public

      - name: Create Git Tag and GitHub Release
        uses: softprops/action-gh-release@v2
        if: env.SHOULD_RELEASE == 'true'
        with:
          tag_name: "v${{ env.CLI_VERSION }}"
          name: "Qodewk Release v${{ env.CLI_VERSION }}"
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            packages/cli/dist/index.cjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
