name: "Release & Publish Package"

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_to_npm:
        description: 'Also publish to public npmjs.com (requires NPM_TOKEN secret)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js (GitHub Packages Registry)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://npm.pkg.github.com'
          scope: '@abushaidislam'
          cache: 'pnpm'

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Monorepo (Turbo)
        run: pnpm build

      - name: Publish to GitHub Packages
        run: |
          echo "Publishing @abushaidislam/qodewk to GitHub Packages..."
          cd packages/cli
          npm publish --registry=https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Public NPM Registry (Optional)
        if: ${{ secrets.NPM_TOKEN != '' || github.event.inputs.publish_to_npm == true }}
        run: |
          echo "Publishing @abushaidislam/qodewk to Public NPM..."
          cd packages/cli
          npm publish --access public --registry=https://registry.npmjs.org --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: "Qodewk Release ${{ github.ref_name }}"
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            packages/cli/dist/index.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
